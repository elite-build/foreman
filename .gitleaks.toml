title = "Source and history secret checks"
minVersion = "v8.30.1"
[extend]
useDefault = true

# Narrow synthetic values used to test credential migration and redaction.
# A different value in the same file must still fail the scanner.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Synthetic migration fixture"
condition = "AND"
paths = ['''(?:^|/)tests/agentKeys\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^(?:cur-1234567890|sk-codex-1234567890|sk-ant-1234567890)$''']

[[rules.allowlists]]
description = "Synthetic CLI environment fixture"
condition = "AND"
paths = ['''(?:^|/)tests/cliEnv\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^sk-live-9f8e7d6c5b4a3210$''']

[[rules.allowlists]]
description = "Synthetic hosted driver fixture"
condition = "AND"
paths = ['''(?:^|/)tests/g1Hosted\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^key_123456789$''']

[[rules.allowlists]]
description = "Synthetic CLI authentication fixture"
condition = "AND"
paths = ['''(?:^|/)tests/gitlab\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^glpat-abcdef123456$''']

[[rules.allowlists]]
description = "Constructed redaction example, never a real credential"
condition = "AND"
paths = ['''(?:^|/)tests/reportProblem\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^abcd1234efgh$''']

[[rules.allowlists]]
description = "Keyboard chord, not an API key"
condition = "AND"
paths = ['''(?:^|/)src/main/walks\.ts$''', '''(?:^|/)tests/fixtures/walks/diff-rows\.json$''']
regexTarget = "secret"
regexes = ['''^shift\+ArrowDown$''']

[[rules.allowlists]]
description = "Keyboard chord, not an API key"
condition = "AND"
paths = ['''(?:^|/)src/renderer/src/shortcuts\.ts$''']
regexTarget = "secret"
regexes = ['''^ctrl\+shift\+KeyO$''']

[[rules.allowlists]]
description = "Anthropic message ID (api_message_id) in recorded agent traffic, an identifier rather than a credential"
condition = "AND"
paths = ['''(?:^|/)src/main/agents/claude/fixtures/[^/]+\.jsonl$''']
regexTarget = "secret"
regexes = ['''^msg_[A-Za-z0-9]{20,}$''']

[[rules.allowlists]]
description = "The Foreman for Chrome extension's RSA public key, which fixes its extension ID; the private key is not in the repository"
condition = "AND"
paths = ['''(?:^|/)resources/chrome-extension/manifest\.json$''']
regexTarget = "secret"
regexes = ['''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvQMf//r1aeTmpE8z7Od1CVCLIs7IYw7iFJuxaf\+J\+9k3/vx4tx2766fSuBBD4X1DusgOD1T0EwdRalux3z9Ex7LQIND2Br91Bax8oFPXmb6ulg2MdSye9AoTKXxMDPuRcCvMJJNXVoQoW0TYJ5nUfL0uvvFUr4X5ASx\+LIfr1t2Mv2WZJJXHuLYd\+ZXad4yyNUf1bi9zQ71c3bVyaXqWOU4cR0rn8pD2b9rEL770LhKsRhpd4GBSPPJP/HWaO09Xr11ul/Yy8F2YQDUiRx8DD/MRXXFMaha\+/fI99GmEFVdClKM37VTsUANXvRUH6ahlplMbWsmyeicgtXWouVxL7QIDAQAB$''']

[[rules]]
id = "aws-access-token"
[[rules.allowlists]]
description = "Constructed redaction example"
condition = "AND"
paths = ['''(?:^|/)tests/reportProblem\.test\.ts$''', '''(?:^|/)scanner-metadata/scan-config\.txt$''']
regexTarget = "secret"
regexes = ['''^AKIAABCDEFGHIJKLMNOP$''']

[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "Constructed redaction example"
condition = "AND"
paths = ['''(?:^|/)tests/reportProblem\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U$''']

[[rules.allowlists]]
description = "Dummy JWT the fixture sanitizer test redacts; its signature is filler, so it never verifies"
condition = "AND"
paths = ['''(?:^|/)tests/agentFixtures\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTYifQ\.abcdefghijk$''']
