name: Release

# Manual only: someone with write access starts it on a version tag made by `npm run release -- tag`
# (`gh workflow run release.yml --ref v<version>`). It builds the installers with the Installers workflow (the macOS app
# signed with the Developer ID certificate and notarized) and attaches them to a draft GitHub release. Drafts are visible only to people with write access; publishing one is a separate, human
# decision (see "Releases" in docs/maintenance.md).
#
# Windows signing is off until the repository variable SIGNPATH_SIGNING is `true` (see CODE_SIGNING.md). Then Foreman.exe
# and the installer are signed through SignPath, which waits for an approver for each, and verified, or the run fails and
# no draft is made. Until then the Windows installer is unsigned, as before, and the run says so.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Read once, so the build and the report on the draft can't disagree about whether Windows was signed.
    outputs:
      sign-windows: ${{ vars.SIGNPATH_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag names package.json's version and is on main
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "::error::Start this workflow on a version tag (--ref v<version>), not a branch."; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$version" ] || { echo "::error::Tag $TAG does not match package.json's version $version."; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main."; exit 1; }

  installers:
    name: Installers
    needs: verify
    uses: ./.github/workflows/installers.yml
    # actions: read lets SignPath's connector fetch the unsigned Windows artifacts from this run.
    permissions:
      contents: read
      actions: read
    # A release's macOS app is always Developer ID signed and notarized: Installers fails rather than build it otherwise.
    # The Windows app and installer are signed once SignPath is set up and SIGNPATH_SIGNING is `true`.
    with:
      sign-macos: true
      sign-windows: ${{ needs.verify.outputs.sign-windows == 'true' }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  release:
    name: Draft release
    needs: [verify, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job with a write token. It checks nothing out and runs no repository or dependency code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Foreman-*
          path: assets
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # gh release create doesn't check for an existing draft of the tag, and GitHub allows several.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | .html_url')
          [ -z "$existing" ] || { echo "::error::$TAG already has a release: $existing"; exit 1; }
          cd assets
          shopt -s nullglob
          dmg=(*.dmg) exe=(*.exe) zip=(*.zip)
          [ ${#dmg[@]} -eq 1 ] && [ ${#exe[@]} -eq 1 ] || { echo "::error::Expected one DMG and one Windows installer."; ls -la; exit 1; }
          # What installed copies update from (main/updateInstaller.ts): each feed names its installer, so both must be here.
          [ ${#zip[@]} -eq 1 ] && [ -f latest.yml ] && [ -f latest-mac.yml ] || { echo "::error::Expected the macOS zip, latest.yml and latest-mac.yml."; ls -la; exit 1; }
          # GitHub turns spaces in asset names into dots; rename first so SHA256SUMS.txt names the files as published.
          for f in *' '*; do mv -- "$f" "${f// /.}"; done
          sha256sum -- * > SHA256SUMS.txt
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "Foreman ${TAG#v}" "${prerelease[@]}" -- *
      # Says plainly which kind of Windows installer the draft carries, so an unsigned one is never taken for signed.
      - name: Report the Windows signature
        env:
          SIGNED: ${{ needs.verify.outputs.sign-windows }}
        run: |
          if [ "$SIGNED" = true ]; then
            echo "The Windows installer and the Foreman.exe inside it were signed through SignPath and verified with SignTool before upload." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The Windows installer in this draft is not code-signed (SIGNPATH_SIGNING is not true; see CODE_SIGNING.md)."
            echo "The Windows installer in this draft is **not code-signed**; SmartScreen will warn on first run." >> "$GITHUB_STEP_SUMMARY"
          fi
