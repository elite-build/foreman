name: CI

# Pull requests into main, once they are ready for review: a draft runs nothing, marking it ready starts a run, and each
# push to a ready PR runs again. The Require CI ruleset requires both jobs by name, with no bypass, so a PR whose types,
# design-system checks or tests fail can't be merged. Renaming a job means changing that ruleset too. Nothing runs after a merge: the Release workflow builds both platforms, and Nightly
# covers macOS, Node 22 and the slower policy checks.
#
# A skipped job reports success, which is harmless here only because GitHub never merges a draft; don't skip these jobs
# on any other condition, or a later skipped run would stand in for a failed one.
on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: the new-component check reads the PR's labels.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Types and design system
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-new-components compares with the PR's base commit.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run check:ui
      - name: New component boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-new-components.mjs "$BASE_SHA"

  tests:
    name: Tests and build
    if: ${{ !github.event.pull_request.draft }}
    # Windows, where the suite is run day to day; Nightly runs it on macOS.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Reviewed native setup only, on disposable hosted runners with no provider credentials.
      - run: npm rebuild node-pty
      - run: git config --global user.name 'CI'; git config --global user.email 'ci@example.invalid'
      # Four workers: the full suite times out under load on Windows with more.
      - run: npm test -- --maxWorkers=4
        env:
          FOREMAN_DATA_DIR: ${{ runner.temp }}/foreman-test-data
      - run: npm run build
