name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  types:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck

  platform:
    name: Validate / ${{ matrix.platform }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: Windows, node: '22' }
          - { os: windows-2022, platform: Windows, node: '24' }
          - { os: macos-15, platform: macOS, node: '22' }
          - { os: macos-15, platform: macOS, node: '24' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Reviewed native setup only, on disposable hosted runners with no provider credentials.
      - run: npm rebuild node-pty
      # The repository's own postinstall, skipped by --ignore-scripts: node-pty's macOS prebuilds publish spawn-helper
      # without the execute bit, so every terminal fails with "posix_spawnp failed". No-op on Windows and, in CI, for hooks.
      - name: Restore node-pty spawn-helper execute permission
        run: node scripts/postinstall.mjs
      - run: git config --global user.name 'CI'; git config --global user.email 'ci@example.invalid'
      - run: npm test -- --maxWorkers=4
        env:
          FOREMAN_DATA_DIR: ${{ runner.temp }}/foreman-test-data
      - run: npm run build

  design:
    name: Design system
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ui
      - name: New component boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/check-new-components.mjs "$BASE_SHA"

  mcp:
    name: MCP coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:mcp

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:security
      - run: npm audit --audit-level=high

  publication:
    name: Publication policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:repository
      - run: npm run check:licenses

  summary:
    name: CI result
    if: always()
    needs: [types, platform, design, mcp, security, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every result to be success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
          const results = JSON.parse(process.env.RESULTS);
          const expected = ["types", "platform", "design", "mcp", "security", "publication"];
          if (Object.keys(results).length !== expected.length || expected.some(id => results[id]?.result !== "success")) {
            console.error("CI checks failed, were skipped, cancelled, or missing");
            process.exit(1);
          }'
