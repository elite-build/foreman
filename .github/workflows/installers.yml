name: Installers

# Manual only: someone with write access starts it from the Actions tab (or `gh workflow run installers.yml --ref <branch>`).
# Builds installers and keeps them as short-lived run artifacts. Nothing is published or released here; the Release
# workflow calls this one with sign-macos and attaches the artifacts to a draft release. Beside each installer go the files
# an installed Foreman updates itself from (main/updateInstaller.ts): latest.yml / latest-mac.yml, the macOS zip, and the
# blockmaps used for smaller downloads.
#
# macOS: with sign-macos the app is signed with the Developer ID certificate, notarized and stapled, and the run fails
# rather than produce anything less (see "macOS signing and notarization" in docs/maintenance.md). Without it the app is
# ad-hoc signed and not notarized, as a test build. The Windows build never sees the Apple secrets.
#
# Windows: with sign-windows, Foreman.exe and then the installer are Authenticode signed through SignPath, each signing
# request waiting for an approver in SignPath, and checked with SignTool, and the run fails rather than produce anything
# less (see CODE_SIGNING.md). Without it the Windows installer is unsigned, as it has always been. The macOS build never
# sees the SignPath token.
on:
  workflow_dispatch:
    inputs:
      sign-macos:
        description: Sign and notarize the macOS app (uses the Apple signing secrets)
        type: boolean
        default: false
      sign-windows:
        description: Sign the Windows app and installer through SignPath (uses the SignPath token; each request needs an approver)
        type: boolean
        default: false
  workflow_call:
    inputs:
      sign-macos:
        type: boolean
        default: false
      sign-windows:
        type: boolean
        default: false
    secrets:
      SIGNPATH_API_TOKEN:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Notarization uploads the app to Apple and waits for its verdict, usually minutes but sometimes much longer. A signed
    # Windows build waits for a person to approve two signing requests in SignPath.
    timeout-minutes: ${{ (matrix.platform == 'Windows' && inputs.sign-windows) && 180 || matrix.timeout }}
    # SignPath's connector reads this run's job details and downloads the unsigned artifact with the job's token.
    permissions:
      contents: read
      actions: read
    env:
      # The common name in the certificate SignPath Foundation signs with; a signed Windows build must carry it.
      SIGNPATH_PUBLISHER: SignPath Foundation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: macOS, script: 'dist:mac:adhoc', timeout: 90, artifact: Foreman-macOS-arm64, files: "dist/*.dmg\ndist/*.zip\ndist/*.blockmap\ndist/latest-mac.yml" }
          - { os: windows-2022, platform: Windows, script: 'dist:win', timeout: 45, artifact: Foreman-Windows-x64, files: "dist/*Setup*.exe\ndist/*Setup*.exe.blockmap\ndist/latest.yml" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
      # Signed Windows build. Missing SignPath configuration fails here, before anything is built. The token itself stays
      # out of this step: only whether it is set is passed in.
      - name: Check the SignPath configuration
        id: signpath
        if: matrix.platform == 'Windows' && inputs.sign-windows
        env:
          HAS_SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
        run: |
          missing=()
          [ "$HAS_SIGNPATH_API_TOKEN" = true ] || missing+=("secret SIGNPATH_API_TOKEN")
          for name in SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG SIGNPATH_APP_CONFIGURATION_SLUG SIGNPATH_INSTALLER_CONFIGURATION_SLUG; do
            [ -n "${!name:-}" ] || missing+=("variable $name")
          done
          [ ${#missing[@]} -eq 0 ] || { echo "::error::A signed Windows build needs these repository settings, which are missing or empty: ${missing[*]}"; exit 1; }
          # SignPath's metadata restrictions check each file's ProductVersion. electron-builder writes Foreman.exe's as
          # major.minor.patch.0 (AppInfo.getVersionInWeirdWindowsForm; GitHub Actions sets none of the build-number
          # variables it reads) and the installer's as package.json's version.
          node -e '
            const version = require("./package.json").version
            const [major, minor, patch] = version.split(".").map((part) => parseInt(part))
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT,
              "installer-version=" + version + "\napp-version=" + [major, minor, patch, 0].join(".") + "\n")
          '
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Lifecycle scripts stay off for the install; only node-pty's native setup and the repository's own postinstall run.
      - run: npm rebuild node-pty
      # Without this the packaged macOS app ships node-pty's spawn-helper without its execute bit and every terminal fails.
      - name: Restore node-pty spawn-helper execute permission
        run: node scripts/postinstall.mjs
      # The dist scripts pass --publish never. No signing identity: the macOS app is ad-hoc signed (dist:mac:adhoc) so its
      # signature is valid, but it is not notarized; Windows is unsigned.
      - name: Build installer
        if: (matrix.platform == 'macOS' && !inputs.sign-macos) || (matrix.platform == 'Windows' && !inputs.sign-windows)
        env:
          DIST_SCRIPT: ${{ matrix.script }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run "$DIST_SCRIPT"

      # Signed macOS build. A missing secret fails here, before anything is built.
      - name: Check the Apple signing secrets and write the API key
        if: matrix.platform == 'macOS' && inputs.sign-macos
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_FILE: ${{ runner.temp }}/notarization/AuthKey.p8
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          [ ${#missing[@]} -eq 0 ] || { echo "::error::A signed macOS build needs these repository secrets, which are missing or empty: ${missing[*]}"; exit 1; }
          # notarytool reads the App Store Connect key from a file; the secret holds the .p8 file Base64-encoded.
          install -d -m 700 "$(dirname "$KEY_FILE")"
          node -e '
            const raw = process.env.APPLE_API_KEY.trim()
            const pem = raw.startsWith("-----BEGIN") ? raw : Buffer.from(raw, "base64").toString("utf8").trim()
            if (!/^-----BEGIN PRIVATE KEY-----\r?\n[\s\S]+\r?\n-----END PRIVATE KEY-----$/.test(pem)) {
              console.log("::error::APPLE_API_KEY is not a Base64-encoded App Store Connect API key (.p8 file)")
              process.exit(1)
            }
            require("node:fs").writeFileSync(process.env.KEY_FILE, pem + "\n", { mode: 0o600 })
          '
      # build.mac signs with the Developer ID certificate in CSC_LINK (forceCodeSigning: none found fails the build),
      # then notarizes with notarytool, waits for Apple's verdict (a rejection fails the build and prints Apple's log)
      # and staples the ticket to the app before the DMG and zip are made.
      # Stapling fetches the ticket from Apple's CloudKit service, and @electron/notarize retries it for only about seven
      # seconds, so a brief network drop there fails an app that Apple has already accepted. electron-builder can't
      # restart from the stapling step, so the whole build runs again, but only when stapling is what failed: a
      # rejection or any other error still fails the step at once.
      - name: Build signed and notarized installer
        if: matrix.platform == 'macOS' && inputs.sign-macos
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notarization/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          LOG_FILE: ${{ runner.temp }}/dist-mac.log
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            npm run dist:mac 2>&1 | tee "$LOG_FILE" && exit 0
            grep -q 'Failed to staple your application' "$LOG_FILE" || exit 1
            [ "$attempt" -lt "$attempts" ] || break
            echo "::warning::Apple accepted the app but stapling its ticket failed (attempt $attempt of $attempts); building again in a minute"
            sleep 60
          done
          echo "::error::Stapling the notarization ticket failed $attempts times; Apple's ticket service may be unreachable from the runner"
          exit 1
      - name: Remove the API key
        if: always() && matrix.platform == 'macOS' && inputs.sign-macos
        run: rm -rf "$RUNNER_TEMP/notarization"
      # Checks what was built, independently of electron-builder: Developer ID and team, Hardened Runtime, timestamps,
      # every nested binary, the stapled ticket and Gatekeeper, in both the DMG and the update zip.
      - name: Verify the signature and notarization
        if: matrix.platform == 'macOS' && inputs.sign-macos
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/verify-mac-release.sh dist "$APPLE_TEAM_ID"

      # Signed Windows build (see CODE_SIGNING.md). SignPath signs only files it fetches from this run's artifacts, so each
      # file goes up as an artifact, is signed by SignPath once an approver approves the request, and comes back.
      # Foreman.exe is signed first and put back into the app, then the installer is built from it and signed in turn.
      # The intermediate artifacts are deliberately not named Foreman-*: the Release workflow attaches every Foreman-*
      # artifact to the draft release.
      - name: Build the Windows app
        if: matrix.platform == 'Windows' && inputs.sign-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-vite build && npx electron-builder --win dir --publish never
      - name: Upload Foreman.exe for signing
        id: unsigned-app
        if: matrix.platform == 'Windows' && inputs.sign-windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-app
          # A rerun of the failed job uploads it again under the same name.
          overwrite: true
          path: dist/win-unpacked/Foreman.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Foreman.exe with SignPath
        if: matrix.platform == 'Windows' && inputs.sign-windows
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            productVersion: ${{ toJSON(steps.signpath.outputs.app-version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath/app
      - name: Verify the signed Foreman.exe
        if: matrix.platform == 'Windows' && inputs.sign-windows
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-release.ps1 -Publisher "$SIGNPATH_PUBLISHER" -File "$RUNNER_TEMP/signpath/app/Foreman.exe"
      # Only Foreman.exe changes; electron-builder then packs the app as it is, without touching the executable again.
      - name: Build the installer from the signed app
        if: matrix.platform == 'Windows' && inputs.sign-windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cp -f -- "$RUNNER_TEMP/signpath/app/Foreman.exe" dist/win-unpacked/Foreman.exe
          npx electron-builder --win nsis --publish never --prepackaged dist/win-unpacked
      - name: Upload the installer for signing
        id: unsigned-installer
        if: matrix.platform == 'Windows' && inputs.sign-windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-installer
          # A rerun of the failed job uploads it again under the same name.
          overwrite: true
          path: dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Sign the installer with SignPath
        if: matrix.platform == 'Windows' && inputs.sign-windows
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            productVersion: ${{ toJSON(steps.signpath.outputs.installer-version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath/installer
      # Signing changed the installer's bytes, so latest.yml and the blockmap electron-builder wrote no longer match it
      # and installed copies would reject the update.
      - name: Put the signed installer in place and update latest.yml and the blockmap
        if: matrix.platform == 'Windows' && inputs.sign-windows
        run: |
          shopt -s nullglob
          signed=("$(cygpath -u "$RUNNER_TEMP")"/signpath/installer/*Setup*.exe)
          unsigned=(dist/*Setup*.exe)
          [ ${#signed[@]} -eq 1 ] && [ ${#unsigned[@]} -eq 1 ] && [ "$(basename "${signed[0]}")" = "$(basename "${unsigned[0]}")" ] \
            || { echo "::error::Expected SignPath to return the one installer that was sent."; ls -la "$RUNNER_TEMP/signpath/installer" dist; exit 1; }
          cp -f -- "${signed[0]}" "${unsigned[0]}"
          node scripts/windows-update-feed.mjs dist
      # The installer, the Foreman.exe inside it (same certificate) and latest.yml, before anything is uploaded.
      - name: Verify the signed installer and update feed
        if: matrix.platform == 'Windows' && inputs.sign-windows
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-release.ps1 -Publisher "$SIGNPATH_PUBLISHER" -Folder dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
